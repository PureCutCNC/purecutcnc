# Materials for the QtPlasmaC simulator check (issue #954), imperial machine.
#
# Format and mandatory keys: QtPlasmaC manual, "Material File"
# (https://linuxcnc.org/docs/2.9/html/plasma/qtplasmac.html#plasma:material-handling).
# The values are not cutting advice. They only have to be plausible and
# different per material, so a report can show which one was really loaded.
#
# Material 0 is the one QtPlasmaC falls back to ("Default material = 0" in the
# sim's prefs file). No reference program may select it: the check resets to it
# before every run and treats "torch fired on material 0" as "the program never
# selected a material".

[MATERIAL_NUMBER_0]
NAME               = sim default - nothing selected
KERF_WIDTH         = 0.06
PIERCE_HEIGHT      = 0.15
PIERCE_DELAY       = 0.2
CUT_HEIGHT         = 0.06
CUT_SPEED          = 160
CUT_AMPS           = 45
CUT_VOLTS          = 100

[MATERIAL_NUMBER_1]
NAME               = sim 1/8 in mild steel
KERF_WIDTH         = 0.06
PIERCE_HEIGHT      = 0.15
PIERCE_DELAY       = 0.2
CUT_HEIGHT         = 0.06
CUT_SPEED          = 200
CUT_AMPS           = 45
CUT_VOLTS          = 110

[MATERIAL_NUMBER_2]
NAME               = sim 1/4 in mild steel
KERF_WIDTH         = 0.07
PIERCE_HEIGHT      = 0.15
PIERCE_DELAY       = 0.3
CUT_HEIGHT         = 0.06
CUT_SPEED          = 140
CUT_AMPS           = 45
CUT_VOLTS          = 120
