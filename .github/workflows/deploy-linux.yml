name: Build Linux Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Choose build mode
        id: build-mode
        uses: ./.github/actions/deploy-build-mode

      - name: Set version
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Build Linux app
        run: npm run tauri build -- --bundles appimage,deb --config ${{ steps.build-mode.outputs.tauri-config }}

      # The bundled libwayland-client comes from this 22.04 runner and is too
      # old for the host EGL stack on newer distros: WebKitGTK aborts with
      # EGL_BAD_PARAMETER or segfaults under Wayland (#929). Repack without it
      # so the host's copy is used, keeping the runtime Tauri produced.
      - name: Remove bundled libwayland-client from the AppImage
        working-directory: src-tauri/target/release/bundle/appimage
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
        run: |
          set -euo pipefail
          appimage=$(ls *.AppImage)
          offset=$(./"$appimage" --appimage-offset)
          head -c "$offset" "$appimage" > runtime
          ./"$appimage" --appimage-extract > /dev/null
          removed=$(find squashfs-root -name 'libwayland-client.so*' -print -delete)
          if [ -z "$removed" ]; then
            echo "::warning::No bundled libwayland-client found; AppImage left unchanged"
            rm -rf squashfs-root runtime
            exit 0
          fi
          echo "Removed: $removed"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          rm "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --comp zstd --runtime-file runtime squashfs-root "$appimage"
          rm -rf squashfs-root runtime appimagetool

      - name: Upload prerelease Linux bundles to release
        id: release-prerelease
        if: contains(inputs.version, '-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          # Tag the commit that was built. Without this the tag is created on
          # the default branch, wrong for a build dispatched from another one.
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        continue-on-error: true

      - name: Upload stable Linux bundles to release
        id: release-stable
        if: ${{ !contains(inputs.version, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          # Tag the commit that was built. Without this the tag is created on
          # the default branch, wrong for a build dispatched from another one.
          target_commitish: ${{ github.sha }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        continue-on-error: true

      # The release uploads above continue on error so a hiccup there does not
      # lose the build. Say so loudly instead of leaving a green run with no
      # installer on the release (the workflow artifact below still has it).
      - name: Report a failed release upload
        if: steps.release-prerelease.outcome == 'failure' || steps.release-stable.outcome == 'failure'
        shell: bash
        run: echo "::warning::The release upload failed. The installer is only in this run's artifacts."

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: PureCutCNC/purecutcnc.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo

      - name: Check Linux download manifest version
        id: manifest-gate
        uses: ./.github/actions/download-manifest-gate
        with:
          version: ${{ inputs.version }}
          platform: linux

      - name: Write Linux download metadata
        if: steps.manifest-gate.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_CHANNEL: ${{ contains(inputs.version, '-') && 'snapshot' || 'stable' }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const releaseTag = process.env.RELEASE_TAG;
            const channel = process.env.RELEASE_CHANNEL;
            const assets = [];
            const appendAssets = (dir, extension, label, kind) => {
              if (!fs.existsSync(dir)) return;
              for (const name of fs.readdirSync(dir).filter((file) => file.endsWith(extension)).sort()) {
                assets.push({
                  name,
                  label,
                  kind,
                  url: 'https://github.com/PureCutCNC/purecutcnc/releases/download/' + releaseTag + '/' + encodeURIComponent(name),
                });
              }
            };
            appendAssets('src-tauri/target/release/bundle/appimage', '.AppImage', 'Download AppImage', 'appimage');
            appendAssets('src-tauri/target/release/bundle/deb', '.deb', 'Download .deb package', 'deb');
            const outputDir = path.join('pages-repo', 'downloads', channel);
            fs.mkdirSync(outputDir, { recursive: true });
            const payload = {
              platform: 'linux',
              channel,
              version: process.env.RELEASE_VERSION,
              tag: releaseTag,
              releaseUrl: 'https://github.com/PureCutCNC/purecutcnc/releases/tag/' + releaseTag,
              updatedAt: new Date().toISOString(),
              assets,
            };
            fs.writeFileSync(path.join(outputDir, 'linux.json'), JSON.stringify(payload, null, 2) + '\n');
          "

      - name: Commit and push Linux download metadata
        if: steps.manifest-gate.outputs.publish == 'true'
        run: |
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git diff --cached --quiet || git commit -m "downloads: update Linux ${{ contains(inputs.version, '-') && 'snapshot' || 'stable' }} metadata for v${{ inputs.version }}"
          git push

      - name: Upload Linux bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureCutCNC-linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
