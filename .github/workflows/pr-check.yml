name: PR Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e-lanes:
    name: E2E - ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Settings
            command: test:e2e:settings
          - lane: Project input
            command: test:e2e:project-input
          - lane: Workflow UI
            command: test:e2e:workflow-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # No --with-deps (issue #564): the apt half re-downloads system/font
        # packages on every run and has repeatedly blown the lane's 10-minute
        # timeout on degraded mirrors. The runner image already carries the
        # shared libraries Chromium needs; the browser binary comes from
        # Playwright's CDN, which is fast and unaffected.
        run: npx playwright install chromium

      - name: Run Playwright e2e lane
        run: npm run ${{ matrix.command }}

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  e2e:
    if: ${{ always() }}
    needs: e2e-lanes
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Verify all E2E lanes passed
        env:
          E2E_LANES_RESULT: ${{ needs.e2e-lanes.result }}
        run: |
          if [ "$E2E_LANES_RESULT" != "success" ]; then
            echo "::error::One or more E2E lanes failed: $E2E_LANES_RESULT"
            exit 1
          fi
