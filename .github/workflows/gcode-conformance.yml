name: G-code Conformance

# Exports a corpus of representative G-code and feeds it to real controller
# interpreters (issue #450). The unit tests re-derive controller rules in
# TypeScript — that encodes our *belief* about them. This job runs the
# firmware's own parser, so a rejection here is the controller's verdict.
#
# Deliberately NOT a required check yet: it clones and compiles third-party
# sources, so a transient upstream failure must not be able to wedge merges.
# Promote to required once it has been green across a run of PRs.
#
# Kept out of pr-check.yml because the validator build is cached separately
# and has nothing to share with the app build.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: conformance-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: gcode-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The validator is built from pinned upstream repositories, so it only
      # needs rebuilding when the setup script itself changes.
      - name: Cache controller interpreters
        id: validator-cache
        uses: actions/cache@v4
        with:
          path: .gcode-conformance/validators
          key: gcode-validators-${{ runner.os }}-${{ hashFiles('scripts/gcode-conformance/setup-validators.sh') }}

      - name: Build controller interpreters
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: ./scripts/gcode-conformance/setup-validators.sh

      - name: Validate exported G-code
        run: npm run check:gcode

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcode-corpus
          path: .gcode-conformance/corpus
          retention-days: 7

  # LinuxCNC's rs274 ships only as a Debian package, so this job runs in a
  # Debian container rather than on the Ubuntu runner. Kept separate from the
  # job above on purpose: if the container or the package regresses, GRBL
  # coverage survives untouched.
  #
  # This is the only place LinuxCNC's *own* rules are applied. Everywhere else
  # — including the linuxcnc-dialect corpus case on the Ubuntu job — the file
  # is judged by GRBL's rules, which answers a different question.
  conformance-linuxcnc:
    name: gcode-conformance (LinuxCNC)
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 20

    steps:
      # The container image is minimal: checkout needs git, and the validator
      # build needs a toolchain.
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git make gcc libc6-dev xz-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install LinuxCNC interpreter
        run: apt-get install -y --no-install-recommends linuxcnc-uspace

      - name: Build GRBL interpreter
        run: ./scripts/gcode-conformance/setup-validators.sh

      - name: Validate exported G-code
        run: npm run check:gcode

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcode-corpus-linuxcnc
          path: .gcode-conformance/corpus
          retention-days: 7
