name: Download manifest gate
description: >
  Decide whether a desktop deploy may replace the published download manifest
  (issue #1000). downloads/{channel}/{platform}.json in the pages repo feeds the
  public downloads page and the desktop update check, so it only moves forward:
  a dispatched version older than the published one — a tester build such as
  `0.0.0-release-0.6.0-preview.1`, or an old version dispatched by mistake —
  still builds and uploads its installer but leaves the manifest alone. Run it
  after the pages repo is checked out to `pages-repo` and `npm ci` has run.

inputs:
  version:
    description: The version being deployed (the workflow's `version` input)
    required: true
  platform:
    description: Manifest platform key (`macos`, `windows` or `linux`)
    required: true

outputs:
  publish:
    description: "`true` when the manifest should be written, `false` to leave it"
    value: ${{ steps.gate.outputs.publish }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_PLATFORM: ${{ inputs.platform }}
      run: npx tsx scripts/download-manifest-gate.ts "$RELEASE_PLATFORM" "$RELEASE_VERSION"
